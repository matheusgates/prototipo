<title>Direções do novo painel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Três direções para o painel da secretaria: A = lista de tarefas, B = ordem do dia, C = busca primeiro */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface2:#f6f8fb; --line:#dfe4ec; --ink:#14203a; --muted:#5b6780;
  --navy:#16285a; --navy-ink:#ffffff; --blue:#2453a6; --blue-soft:#e6eefb; --gold:#c9a227; --gold-soft:#f7efcf;
  --ok:#1f7a4d; --ok-soft:#e2f3ea; --warn:#9a6200; --warn-soft:#fbefd6; --bad:#b3263a; --bad-soft:#fbe4e7;
  --shadow:0 1px 2px rgba(20,32,58,.06),0 8px 24px rgba(20,32,58,.08);
  --f-a:"Public Sans",system-ui,sans-serif; --f-b:"Barlow",system-ui,sans-serif; --f-bd:"Barlow Condensed","Arial Narrow",sans-serif; --f-c:"Onest",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --emblem:#16285a;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1424; --surface:#151e33; --surface2:#1b2640; --line:#2a3757; --ink:#e8edf7; --muted:#9aa7c2;
  --navy:#0f1b3d; --navy-ink:#eef2fb; --blue:#8fb0f0; --blue-soft:#1d2c4f; --gold:#e0be4e; --gold-soft:#3a3218;
  --ok:#6fd3a0; --ok-soft:#173527; --warn:#f0bd62; --warn-soft:#3b2d12; --bad:#ff8a9a; --bad-soft:#3d1a22;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --emblem:#e0be4e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1424; --surface:#151e33; --surface2:#1b2640; --line:#2a3757; --ink:#e8edf7; --muted:#9aa7c2;
  --navy:#0f1b3d; --navy-ink:#eef2fb; --blue:#8fb0f0; --blue-soft:#1d2c4f; --gold:#e0be4e; --gold-soft:#3a3218;
  --ok:#6fd3a0; --ok-soft:#173527; --warn:#f0bd62; --warn-soft:#3b2d12; --bad:#ff8a9a; --bad-soft:#3d1a22;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --emblem:#e0be4e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-a);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4,p{margin:0}
.wrap{max-width:1280px;margin:0 auto}

/* seletor das direções */
.picker{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);padding-block:16px 12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--bg)}
.picker h1{font-size:18px;font-weight:700}
.picker p{color:var(--muted);font-size:13px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;position:relative}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);position:relative;z-index:1;transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--navy-ink)}
.seg .thumb{position:absolute;top:4px;bottom:4px;border-radius:9px;background:var(--navy);transition:left .35s var(--ease),width .35s var(--ease)}
.nota{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:14px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;align-items:baseline}
.nota b{color:var(--ink)}
.stage{position:relative}
.dir{animation:dirIn .45s var(--ease)}
@keyframes dirIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.frame{border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--surface);position:relative;min-height:720px}

/* comuns */
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;background:var(--blue-soft);color:var(--blue)}
.av.lg{width:64px;height:64px;font-size:20px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-Ativo{background:var(--ok-soft);color:var(--ok)} .s-Pendente{background:var(--warn-soft);color:var(--warn)} .s-Inativo{background:var(--surface2);color:var(--muted)}
.btn{border:0;background:var(--blue);color:var(--surface);font-weight:600;padding:9px 16px;border-radius:10px;font-size:14px;transition:transform .15s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--blue-soft)}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;transition:.3s var(--ease);z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* tarefa saindo */
.task{transition:opacity .35s var(--ease),transform .35s var(--ease),max-height .4s var(--ease) .15s,padding .4s var(--ease) .15s,margin .4s var(--ease) .15s;max-height:200px;overflow:hidden}
.task.done{opacity:0;transform:translateX(24px);max-height:0;padding-block:0!important;margin:0!important;border-width:0!important}
.stagger>*{animation:rise .5s var(--ease) both}
.stagger>*:nth-child(2){animation-delay:.05s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.15s}.stagger>*:nth-child(5){animation-delay:.2s}.stagger>*:nth-child(6){animation-delay:.25s}.stagger>*:nth-child(7){animation-delay:.3s}.stagger>*:nth-child(8){animation-delay:.35s}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ======== A · lista de tarefas ======== */
.A{display:grid;grid-template-columns:232px 1fr;min-height:720px;font-family:var(--f-a)}
.A .rail{background:var(--navy);color:var(--navy-ink);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:relative}
.A .rail::after{content:"";position:absolute;top:0;bottom:0;right:0;width:3px;background:linear-gradient(var(--gold),var(--gold)) left/1px 100% no-repeat,linear-gradient(var(--gold),var(--gold)) right/1px 100% no-repeat}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:22px;padding-inline:6px}
.selo{width:36px;height:36px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--gold)}
.brand b{font-size:15px;line-height:1.2}
.A .nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:0;background:none;color:inherit;opacity:.78;text-align:left;font-size:14.5px;transition:background .2s,opacity .2s}
.A .nav:hover{background:rgba(255,255,255,.07);opacity:1}
.A .nav.on{background:rgba(255,255,255,.12);opacity:1;font-weight:600}
.A .nav .badge{margin-left:auto;background:var(--gold);color:#16285a;font-size:12px;font-weight:700;border-radius:999px;padding:0 8px}
.A .nav.more{margin-top:auto}
.A main{padding:32px 36px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-content:start;background:var(--bg)}
.A .hello h2{font-size:28px;font-weight:700;letter-spacing:-.01em}
.A .hello p{color:var(--muted);margin-top:4px;font-size:16px}
.A .tasks{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.A .task{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.A .task:hover{border-color:color-mix(in srgb,var(--blue) 40%,var(--line))}
.A .tico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.t-warn{background:var(--warn-soft);color:var(--warn)} .t-blue{background:var(--blue-soft);color:var(--blue)} .t-ok{background:var(--ok-soft);color:var(--ok)} .t-bad{background:var(--bad-soft);color:var(--bad)}
.A .task h4{font-size:15px;font-weight:600}
.A .task p{font-size:13.5px;color:var(--muted)}
.A .task .tx{flex:1;min-width:0}
.A .side{display:flex;flex-direction:column;gap:20px}
.A .nums{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 18px}
.A .nums div{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.A .nums div:last-child{border:0}
.A .nums span{color:var(--muted);font-size:14px}
.A .nums b{font-size:20px;font-weight:700}
.A h3{font-size:15px;font-weight:600;margin-bottom:10px}
.A .people{display:flex;flex-direction:column;gap:2px}
.A .person{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:10px;border:0;background:none;text-align:left;width:100%;transition:background .2s}
.A .person:hover{background:var(--surface)}
.A .person small{display:block;color:var(--muted);font-size:12.5px}
.A .person .tx{flex:1;min-width:0;font-size:14px;font-weight:500}
.A .empty{display:none;text-align:left;padding:28px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
.A .empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
/* gaveta A */
.scrim{position:absolute;inset:0;background:rgba(10,18,36,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:21;transform:translateX(100%);transition:transform .42s var(--ease);display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(10,18,36,.18)}
.drawer.on{transform:none}
.drawer header{padding:22px 22px 18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.drawer header h3{font-size:19px;font-weight:700;line-height:1.25}
.drawer header p{color:var(--muted);font-size:13.5px}
.x{border:0;background:var(--surface2);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;align-self:start}
.drawer .body{overflow:auto;padding:18px 22px 28px;display:flex;flex-direction:column;gap:12px}
.callout{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;font-size:14px}
.callout span{flex:1}
.callout .btn{background:var(--warn);color:var(--surface)}
.acc{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.acc>button{width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;border:0;background:none;text-align:left;font-weight:600;font-size:14.5px}
.acc>button small{font-weight:400;color:var(--muted);margin-left:auto;font-size:13px}
.acc>button .chev{transition:transform .3s var(--ease);width:18px;height:18px}
.acc.open>button .chev{transform:rotate(180deg)}
.acc .in{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.acc.open .in{grid-template-rows:1fr}
.acc .in>div{overflow:hidden}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;padding:0 14px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.bar{height:6px;border-radius:9px;background:var(--surface2);overflow:hidden;margin:2px 14px 10px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px}

/* ======== B · ordem do dia ======== */
.B{font-family:var(--f-b);min-height:720px;background:var(--bg)}
.B .band{background:var(--navy);color:var(--navy-ink);padding:18px 32px 0;position:relative;overflow:hidden}
.B .band .top{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.B .band nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.B .band nav button{border:0;background:none;color:inherit;opacity:.75;padding:8px 12px;font-size:15px;font-weight:500;border-radius:8px}
.B .band nav button.on{opacity:1;background:rgba(255,255,255,.12)}
.B .divisa{position:absolute;right:28px;bottom:-14px;width:150px;height:120px;opacity:.9;pointer-events:none}
.B .band .title{padding:34px 0 28px;max-width:640px}
.B .band .title small{font-size:15px;opacity:.75}
.B .band .title h2{font-family:var(--f-bd);font-weight:700;font-size:54px;line-height:1;letter-spacing:.005em;margin-top:4px}
.B .band .title p{margin-top:10px;font-size:17px;opacity:.85}
.B .content{padding:28px 32px 36px;display:flex;flex-direction:column;gap:30px}
.B h3{font-family:var(--f-bd);font-size:24px;font-weight:600;margin-bottom:12px;display:flex;align-items:baseline;gap:12px}
.B h3 small{font-family:var(--f-b);font-size:14px;font-weight:400;color:var(--muted)}
.B .tickets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.B .task{background:var(--surface);border-radius:4px 14px 14px 14px;padding:16px 18px;border-top:3px solid var(--gold);display:flex;flex-direction:column;gap:8px}
.B .task h4{font-size:16.5px;font-weight:600;line-height:1.3}
.B .task p{color:var(--muted);font-size:14px;flex:1}
.B .task .row{display:flex;justify-content:space-between;align-items:center}
.B .task .row small{color:var(--muted);font-size:13px}
.B .ids{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.B .idc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:12px;transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s}
.B .idc:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:transparent}
.B .idc .hd{display:flex;justify-content:space-between;align-items:flex-start}
.B .idc .posto{font-family:var(--f-bd);font-weight:700;font-size:28px;line-height:1;color:var(--emblem)}
.B .idc b{font-size:16px;font-weight:600;line-height:1.25}
.B .idc small{color:var(--muted);font-size:13.5px}
.B .modal{position:absolute;inset:0;z-index:21;display:grid;place-items:center;padding:24px;pointer-events:none}
.B .card{pointer-events:auto;width:min(720px,100%);max-height:100%;overflow:auto;background:var(--surface);border-radius:18px;box-shadow:0 30px 80px rgba(10,18,36,.35);transform-origin:var(--ox,50%) var(--oy,50%);animation:pop .45s var(--ease)}
.B .card.out{animation:popOut .25s ease-in forwards}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes popOut{to{opacity:0;transform:scale(.9)}}
.B .cart{background:var(--navy);color:var(--navy-ink);padding:22px 24px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;position:relative;overflow:hidden}
.B .cart .av{background:var(--gold);color:#16285a}
.B .cart h3{font-family:var(--f-bd);font-size:30px;margin:0;line-height:1.05;color:var(--navy-ink)}
.B .cart p{opacity:.8;font-size:14.5px}
.B .cart .x{background:rgba(255,255,255,.12);color:var(--navy-ink)}
.B .cbody{padding:20px 24px 24px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.B .cbody section{display:flex;flex-direction:column;gap:6px}
.B .cbody h4{font-family:var(--f-bd);font-size:19px;font-weight:600}
.B .cbody .full{grid-column:1/-1}
.B .line{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.B .line span:first-child{color:var(--muted)}
.B .docs{display:flex;flex-wrap:wrap;gap:6px}
.B .doc{font-size:13px;padding:4px 10px;border-radius:8px;background:var(--ok-soft);color:var(--ok)}
.B .doc.no{background:var(--warn-soft);color:var(--warn)}

/* ======== C · busca primeiro ======== */
.C{font-family:var(--f-c);min-height:720px;background:var(--surface)}
.C .bar2{display:flex;align-items:center;gap:22px;padding:16px 32px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.C .bar2 nav{display:flex;gap:4px;flex-wrap:wrap}
.C .bar2 nav button{border:0;background:none;padding:7px 12px;border-radius:8px;color:var(--muted);font-weight:500;font-size:14.5px}
.C .bar2 nav button.on{color:var(--ink);background:var(--surface2)}
.C .bar2 .selo{border-color:var(--emblem);color:var(--emblem)}
.C .view{padding:44px 32px 40px;max-width:900px}
.C .view.leave{animation:viewOut .2s ease-in forwards}
.C .view.enter{animation:viewIn .4s var(--ease)}
@keyframes viewOut{to{opacity:0;transform:translateX(-16px)}}
@keyframes viewIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.C h2{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.C .search{margin-top:20px;position:relative}
.C .search .ic{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--muted);width:22px;height:22px}
.C .search input{width:100%;font:inherit;font-size:18px;padding:18px 18px 18px 54px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);transition:border-color .2s,box-shadow .2s,background .2s}
.C .search input:focus{outline:0;border-color:var(--blue);background:var(--surface);box-shadow:0 0 0 4px var(--blue-soft)}
.C .results{margin-top:8px;display:flex;flex-direction:column}
.C .res{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:12px;border:0;background:none;text-align:left;width:100%;animation:rise .3s var(--ease) both;transition:background .15s}
.C .res:hover,.C .res:focus-visible{background:var(--surface2)}
.C .res .tx{flex:1;min-width:0}
.C .res b{font-weight:500}
.C .res small{display:block;color:var(--muted);font-size:13px}
.C .hint{color:var(--muted);font-size:14px;padding:6px 12px}
.C .need{margin-top:34px}
.C .need h3,.C .quick h3{font-size:16px;font-weight:600;margin-bottom:12px}
.C .pills{display:flex;flex-wrap:wrap;gap:8px}
.C .task.pill{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px 8px 8px;font-size:14px;transition:border-color .2s,background .2s}
.C .task.pill:hover{border-color:var(--blue);background:var(--blue-soft)}
.C .task.pill .n{min-width:28px;height:28px;border-radius:999px;display:grid;place-items:center;font-weight:700;font-size:13px}
.C .task.pill.done{max-width:0;padding:0;border:0}
.C .quick{margin-top:34px}
.C .qgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.C .q{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;font-weight:500;transition:border-color .2s,transform .2s var(--ease)}
.C .q:hover{border-color:var(--blue);transform:translateY(-2px)}
.C .q .ic{color:var(--blue)}
/* ficha C (página) */
.C .back{border:0;background:none;color:var(--blue);font-weight:500;display:inline-flex;gap:6px;align-items:center;padding:6px 0;margin-bottom:18px}
.C .fp{display:grid;grid-template-columns:260px minmax(0,1fr);gap:36px}
.C .fp aside{display:flex;flex-direction:column;gap:12px}
.C .fp aside h2{font-size:24px}
.C .fp aside p{color:var(--muted);font-size:14px}
.C .fp aside .btn{margin-top:6px}
.C .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);position:relative;margin-bottom:18px;overflow-x:auto}
.C .tabs button{border:0;background:none;padding:10px 14px;font-weight:500;color:var(--muted);white-space:nowrap}
.C .tabs button[aria-selected="true"]{color:var(--ink)}
.C .tabs .ul{position:absolute;bottom:-1px;height:2px;background:var(--blue);transition:left .3s var(--ease),width .3s var(--ease)}

  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.d===D));moveThumb();
}
function moveThumb(){const b=document.querySelector(`.seg button[data-d="${D}"]`),t=document.querySelector(".seg .thumb");t.style.left=b.offsetLeft+"px";t.style.width=b.offsetWidth+"px"}
function openP(id,src){
  const p=P.find(x=>x.id==id);curP=p;
  if(D==="A"){const d=stage.querySelector(".drawer");d.innerHTML=fichaA(p);stage.querySelector(".scrim").classList.add("on");requestAnimationFrame(()=>d.classList.add("on"));d.querySelector(".x").focus({preventScroll:true})}
  if(D==="B"){const m=stage.querySelector(".modal"),fr=stage.querySelector(".B").getBoundingClientRect(),r=src.getBoundingClientRect();m.innerHTML=fichaB(p);const c=m.querySelector(".card");const cr=c.getBoundingClientRect();
    c.style.setProperty("--ox",(r.left+r.width/2-cr.left)+"px");c.style.setProperty("--oy",(r.top+r.height/2-cr.top)+"px");stage.querySelector(".scrim").classList.add("on");c.querySelector(".x").focus({preventScroll:true})}
  if(D==="C"){swapC(fichaC(p),ulC)}
}
function closeP(){
  if(D==="A"){stage.querySelector(".drawer")?.classList.remove("on");stage.querySelector(".scrim")?.classList.remove("on")}
  if(D==="B"){const c=stage.querySelector(".B .card");stage.querySelector(".scrim")?.classList.remove("on");if(c){c.classList.add("out");setTimeout(()=>stage.querySelector(".modal").innerHTML="",240)}}
}
document.addEventListener("click",e=>{
  const s=e.target.closest(".seg button");if(s){if(s.dataset.d!==D){D=s.dataset.d;render()}return}
  const d=e.target.closest("[data-do]");if(d){resolve(d);return}
  const p=e.target.closest("[data-p]");if(p){openP(p.dataset.p,p);return}
  if(e.target.closest("[data-close]")){closeP();return}
  const a=e.target.closest("[data-acc]");if(a){a.parentElement.classList.toggle("open");return}
  if(e.target.closest("[data-home]")){swapC(homeC());return}
  const tb=e.target.closest("[data-tab]");if(tb){stage.querySelectorAll(".C [data-tab]").forEach(b=>b.setAttribute("aria-selected",b===tb));ulC();document.getElementById("cpane").innerHTML=paneC(+tb.dataset.tab,curP);return}
  const q=e.target.closest(".q,.nav,.band nav button,.bar2 nav button");if(q&&!q.classList.contains("on")){toast("Nesta prévia só a tela inicial e a ficha funcionam")}
});
document.addEventListener("input",e=>{if(e.target.id==="cq"){const v=e.target.value.trim().toLowerCase();const l=v?P.filter(p=>(p.nome+" "+p.mat).toLowerCase().includes(v)):P.slice(0,3);
  document.getElementById("cres").innerHTML=(v?"":'<p class="hint">Recentes</p>')+(l.length?resC(l):`<p class="hint">Ninguém com “${e.target.value}”. Confira a grafia ou procure pela matrícula.</p>`)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeP()});
addEventListener("resize",()=>{moveThumb();ulC()});
render();document.fonts?.ready.then(moveThumb);
</script>
